[project]
name = "dz-catalog-analysis-chaykovskiy-m26-555"
version = "0.1.0"
description = "Movie catalog analysis"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
